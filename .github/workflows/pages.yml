# GitHub Pages 배포 (v2.3.1): 앱 파일만 올리고 tests/·tools/ 등 개발용 파일은 공개하지 않음
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 앱 파일만 모으기
        run: |
          mkdir _site
          cp -r index.html app.css sw.js manifest.webmanifest .nojekyll js data fonts icons models vendor _site/
          test -f _site/index.html && test -f _site/js/app.js && test -f _site/data/cosmetics.json
          ! test -e _site/tests && ! test -e _site/tools
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
